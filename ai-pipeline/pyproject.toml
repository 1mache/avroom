[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "avroom-object-removal"
version = "0.1.0"
description = "Object removal AI pipeline (depth, segmentation, inpainting, 3D reconstruction)."
requires-python = ">=3.11"
dependencies = [
    "einops>=0.7.0",
    "gradio_client>=1.4",
    "huggingface_hub>=0.20",
    "imageio[ffmpeg]>=2.31",
    "kiui",
    "numpy",
    "omegaconf>=2.3.0",
    "opencv-python",
    "Pillow",
    "PyMCubes>=0.1.4",
    "PyOpenGL>=3.1.0",
    "pyrender>=0.1.45",
    "rembg",
    "torch>=2.1",
    # NOTE: `torchmcubes` is deliberately NOT listed here, though the TripoSR
    # backend that needs it is still fully present and supported. It compiles a
    # C++/CUDA extension via `find_package(Torch)`, and torch's own CMake config
    # refuses to configure unless a full CUDA *toolkit* (nvcc, headers) is on the
    # box - the `nvidia-*-cu12` runtime libraries that ship inside the PyPI torch
    # wheel are not enough. That makes it unbuildable in the slim container image
    # (see fastApi-app/Dockerfile) without pulling in a ~6GB CUDA-devel base.
    #
    # Nothing imports it at module scope: TripoSR's only use is behind a lazy,
    # guarded import in triposr_reconstruction_strategy.py::_load_tsr_model, so
    # its absence costs exactly one thing - the TripoSR *fallback* for 3D
    # reconstruction, behind the primary Hunyuan3D Space backend.
    #
    # TO RE-ENABLE (local machines with the CUDA toolkit, or a CUDA-devel image):
    #     pip install "torchmcubes @ git+https://github.com/tatsy/torchmcubes.git"
    # No code change is required - the strategy starts working again on import.
    "torchvision>=0.16",
    "transformers>=4.36",
    "trimesh>=4.0.0",
]

[tool.setuptools]
packages = [
    "avroom_object_removal",
    "avroom_object_removal.ai_engines",
    "avroom_object_removal.ai_engines.camera_calibration",
    "avroom_object_removal.ai_engines.camera_calibration.strategies",
    "avroom_object_removal.ai_engines.content_validation",
    "avroom_object_removal.ai_engines.content_validation.strategies",
    "avroom_object_removal.ai_engines.elevation_estimation",
    "avroom_object_removal.ai_engines.elevation_estimation.strategies",
    "avroom_object_removal.ai_engines.depth",
    "avroom_object_removal.ai_engines.depth.strategies",
    "avroom_object_removal.ai_engines.inpainting",
    "avroom_object_removal.ai_engines.inpainting.strategies",
    "avroom_object_removal.ai_engines.inpainting_verification",
    "avroom_object_removal.ai_engines.inpainting_verification.strategies",
    "avroom_object_removal.ai_engines.novel_view",
    "avroom_object_removal.ai_engines.novel_view.strategies",
    "avroom_object_removal.ai_engines.reconstruction_3d",
    "avroom_object_removal.ai_engines.reconstruction_3d._backends",
    "avroom_object_removal.ai_engines.reconstruction_3d.strategies",
    "avroom_object_removal.ai_engines.segmentation",
    "avroom_object_removal.ai_engines.segmentation.strategies",
    "avroom_object_removal.core",
    "avroom_object_removal.routing",
    "avroom_object_removal.routing.strategies",
    "avroom_object_removal.utils",
]

[tool.setuptools.package-dir]
avroom_object_removal = "src"

[tool.setuptools.package-data]
"avroom_object_removal.ai_engines.reconstruction_3d._backends" = [
    "triposr/tsr/**/*.py",
    "triposr/LICENSE.TripoSR",
]
