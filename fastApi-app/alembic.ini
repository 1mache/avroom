[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url intentionally omitted -- alembic/env.py sets it at runtime
# from settings.get_database_url(), the same DATABASE_URL the app itself
# uses, so there is exactly one place that decides which database this
# points at.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
